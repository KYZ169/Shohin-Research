services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resale_radar
      POSTGRES_PASSWORD: resale_radar
      POSTGRES_DB: resale_radar
    ports:
      # 本番ConoHa VPSには別プロジェクト(aquarium系Bot群)用のネイティブPostgreSQLが
      # 既にホストの5432番を使用しているため、コンテナ内部は5432のままホスト側のみ
      # 55432に変更して衝突を避ける(api/worker/beatコンテナ同士の通信はdocker
      # ネットワーク内でdbホスト名:5432を使うため、この変更による影響は無い)。
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resale_radar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: .
    command: celery -A app.scheduler.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app

  beat:
    build: .
    command: celery -A app.scheduler.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app

volumes:
  postgres_data:
